# Leantime 生产环境 Docker Compose（单机部署）
#
# 使用：
#   cd deploy
#   cp .env.prod.example .env      # 然后编辑 .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 默认数据库为 PostgreSQL（更省内存）。若改用 MySQL，见文件末尾注释。
name: leantime

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LEAN_DB_DATABASE:-leantime}
      POSTGRES_USER: ${LEAN_DB_USER:-leantime}
      POSTGRES_PASSWORD: ${LEAN_DB_PASSWORD:?请在 deploy/.env 中设置 LEAN_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEAN_DB_USER:-leantime} -d ${LEAN_DB_DATABASE:-leantime}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LEAN_REDIS_PASSWORD:?请在 deploy/.env 中设置 LEAN_REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LEAN_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    image: leantime-local:${LEAN_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - userfiles:/var/www/html/userfiles
      - public_userfiles:/var/www/html/public/userfiles
      - plugins:/var/www/html/app/Plugins
      - logs:/var/www/html/storage/logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  redis_data:
  userfiles:
  public_userfiles:
  plugins:
  logs:

